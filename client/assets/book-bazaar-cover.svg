<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22223b"/>
      <stop offset="1" stop-color="#4a4e69"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.65">
      <stop offset="0" stop-color="#f6ad55" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f6ad55" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" rx="28" fill="url(#bg)"/>
  <rect width="800" height="450" rx="28" fill="url(#glow)"/>

  <circle cx="36" cy="36" r="6" fill="#f2e9e4" opacity="0.35"/>
  <circle cx="58" cy="36" r="6" fill="#f2e9e4" opacity="0.25"/>
  <circle cx="80" cy="36" r="6" fill="#f2e9e4" opacity="0.15"/>

  <!-- open book -->
  <path d="M400 130 C 340 105 280 105 260 120 L260 270 C 280 255 340 255 400 280 Z" fill="#f2e9e4" opacity="0.9"/>
  <path d="M400 130 C 460 105 520 105 540 120 L540 270 C 520 255 460 255 400 280 Z" fill="#f2e9e4" opacity="0.75"/>
  <line x1="400" y1="130" x2="400" y2="280" stroke="#22223b" stroke-width="3" opacity="0.35"/>

  <line x1="285" y1="150" x2="375" y2="168" stroke="#c9ada7" stroke-width="4" opacity="0.6"/>
  <line x1="285" y1="172" x2="375" y2="190" stroke="#c9ada7" stroke-width="4" opacity="0.6"/>
  <line x1="285" y1="194" x2="360" y2="210" stroke="#c9ada7" stroke-width="4" opacity="0.6"/>

  <line x1="425" y1="168" x2="515" y2="150" stroke="#c9ada7" stroke-width="4" opacity="0.6"/>
  <line x1="425" y1="190" x2="515" y2="172" stroke="#c9ada7" stroke-width="4" opacity="0.6"/>
  <line x1="440" y1="210" x2="515" y2="194" stroke="#c9ada7" stroke-width="4" opacity="0.6"/>

