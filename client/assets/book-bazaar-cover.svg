  <text x="40" y="390" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#f2e9e4">BOOK BAZZAR</text>
  <text x="40" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2" fill="#f6ad55">E-COMMERCE BOOKSTORE</text>
