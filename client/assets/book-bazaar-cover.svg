    <path d="M18 20 h8 l6 34 h30 l8 -24 h-40" fill="none" stroke="#22223b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="60" r="4" fill="#22223b"/>
