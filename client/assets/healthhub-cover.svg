<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22223b"/>
      <stop offset="1" stop-color="#4a4e69"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.65">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" rx="28" fill="url(#bg)"/>
  <rect width="800" height="450" rx="28" fill="url(#glow)"/>

  <circle cx="36" cy="36" r="6" fill="#f2e9e4" opacity="0.35"/>
  <circle cx="58" cy="36" r="6" fill="#f2e9e4" opacity="0.25"/>
  <circle cx="80" cy="36" r="6" fill="#f2e9e4" opacity="0.15"/>

  <!-- phone / dashboard card -->
  <rect x="300" y="70" width="200" height="270" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#2dd4bf" stroke-width="5"/>
  <rect x="322" y="100" width="156" height="14" rx="7" fill="#f2e9e4" opacity="0.5"/>
  <rect x="322" y="128" width="110" height="10" rx="5" fill="#f2e9e4" opacity="0.3"/>

  <!-- heartbeat pulse -->
  <polyline points="322,220 350,220 366,180 384,260 402,150 420,220 478,220" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="322" y="284" width="60" height="30" rx="8" fill="#2dd4bf" opacity="0.25"/>
  <rect x="392" y="284" width="86" height="30" rx="8" fill="#2dd4bf" opacity="0.15"/>

  <!-- cross badge -->
  <circle cx="486" cy="96" r="30" fill="#2dd4bf"/>
  <rect x="478" y="82" width="16" height="28" rx="4" fill="#22223b"/>
  <rect x="472" y="88" width="28" height="16" rx="4" fill="#22223b"/>

  <text x="40" y="390" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#f2e9e4">HealthHub</text>
  <text x="40" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2" fill="#2dd4bf">HOSPITAL MANAGEMENT SYSTEM</text>
</svg>
