<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22223b"/>
      <stop offset="1" stop-color="#4a4e69"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.65">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" rx="28" fill="url(#bg)"/>
  <rect width="800" height="450" rx="28" fill="url(#glow)"/>

  <circle cx="36" cy="36" r="6" fill="#f2e9e4" opacity="0.35"/>
  <circle cx="58" cy="36" r="6" fill="#f2e9e4" opacity="0.25"/>
  <circle cx="80" cy="36" r="6" fill="#f2e9e4" opacity="0.15"/>

  <!-- sun -->
  <circle cx="560" cy="140" r="46" fill="#38bdf8" opacity="0.5"/>

  <!-- horizon / mountains -->
  <path d="M260 300 L340 210 L400 270 L470 190 L560 300 Z" fill="#f2e9e4" opacity="0.12"/>
  <path d="M220 300 L300 230 L360 300 Z" fill="#f2e9e4" opacity="0.18"/>

  <!-- ground line -->
  <rect x="180" y="300" width="440" height="6" rx="3" fill="#38bdf8" opacity="0.5"/>

  <!-- location pin -->
  <path d="M340 260 c0 -34 54 -34 54 0 c0 30 -27 56 -27 56 s-27 -26 -27 -56 z" fill="#38bdf8"/>
  <circle cx="367" cy="258" r="13" fill="#22223b"/>

  <!-- paper airplane -->
  <g transform="translate(430,150) rotate(28)">
    <path d="M0 0 L120 26 L18 44 L0 0 Z" fill="#f2e9e4"/>
    <path d="M18 44 L38 60 L28 34 Z" fill="#c9ada7"/>
  </g>

  <text x="40" y="390" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#f2e9e4">My Dream Place</text>
  <text x="40" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2" fill="#38bdf8">TRAVEL &amp; BOOKING</text>
</svg>
